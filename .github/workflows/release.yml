name: Build and release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test and build APK
        run: ./gradlew testDebugUnitTest assembleDebug

      - name: Read release version
        id: version
        shell: bash
        run: |
          version_name="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)"/\1/p' app/build.gradle.kts)"
          if [[ -z "$version_name" ]]; then
            echo "Could not read versionName from app/build.gradle.kts" >&2
            exit 1
          fi
          echo "tag=v${version_name}" >> "$GITHUB_OUTPUT"

      - name: Prepare release files
        shell: bash
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "CellScope-${{ steps.version.outputs.tag }}.apk"
          sha256sum "CellScope-${{ steps.version.outputs.tag }}.apk" > "CellScope-${{ steps.version.outputs.tag }}.apk.sha256"

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "Release ${{ steps.version.outputs.tag }} already exists; increment versionName before releasing again." >&2
            exit 1
          fi
          gh release create "${{ steps.version.outputs.tag }}" \
            "CellScope-${{ steps.version.outputs.tag }}.apk" \
            "CellScope-${{ steps.version.outputs.tag }}.apk.sha256" \
            --target "$GITHUB_SHA" \
            --title "CellScope ${{ steps.version.outputs.tag }}" \
            --generate-notes
